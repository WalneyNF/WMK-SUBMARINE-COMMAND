<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMK Ocean Studio 0.4.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#d8e7ed;font:13px "Segoe UI",sans-serif;overflow:hidden}header{height:54px;display:flex;align-items:center;gap:12px;padding:8px 16px;background:#14242f;border-bottom:1px solid #405763;position:relative;z-index:4}header img{width:55px}header strong{color:#62dfd3;letter-spacing:1px}button,select,input{font:inherit;color:inherit;background:#203542;border:1px solid #47606b;border-radius:4px;padding:5px}button{cursor:pointer}button:hover{border-color:#62dfd3}a{color:#62dfd3}#viewport{position:absolute;inset:54px 0 24px}canvas{display:block}footer{position:fixed;bottom:0;width:100%;background:#14242f;padding:4px 12px;z-index:4}section{position:absolute;z-index:3;width:310px;max-width:95vw;max-height:calc(100vh - 90px);background:#101d27ed;border:1px solid #405763;border-radius:5px;overflow:auto;resize:both;box-shadow:0 8px 25px #0005}section h2{position:sticky;top:0;margin:0;background:#203542;cursor:move;user-select:none;touch-action:none;display:flex;justify-content:space-between;align-items:center;padding:8px;font-size:13px;z-index:1}section .content{padding:10px}label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}input[type=range]{width:48%;padding:0;accent-color:#62dfd3}output{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}details{border-top:1px solid #405763;margin-top:9px;padding-top:8px}summary{cursor:pointer;color:#62dfd3}#params{left:12px;top:67px}#preview{right:12px;top:67px;width:255px}#jsonPanel{left:12px;bottom:35px;width:400px;display:none}textarea{width:100%;height:220px;background:#07141e;color:#a9e5d9;border:1px solid #405763;font:12px monospace} .buttons{display:flex;gap:5px;flex-wrap:wrap}small{color:#9aadb8}#status{color:#62dfd3}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<header><img src="../assets/logo.svg" alt="WMK"><strong>WMK OCEAN STUDIO</strong><a href="../index.html">Jogo</a><button data-open="params">Propriedades</button><button data-open="preview">Simulação</button><button data-open="jsonPanel">JSON</button><button id="layoutReset">Restaurar layout</button></header>
<div id="viewport"></div>
<section id="params"><h2>Material e ondas <button data-close="params">×</button></h2><div class="content"><label>Preset <select id="preset"><option value="custom">Personalizado</option><option value="normal">Original</option><option value="calm">Calmo</option><option value="rough">Agitado</option><option value="tropical">Tropical</option></select></label><div id="fields"></div><div id="waves"></div><div class="buttons"><button id="save">Salvar para o jogo</button><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><button id="reset">Restaurar oceano</button></div><input id="file" type="file" accept=".json,application/json" hidden><p id="status" role="status"></p></div></section>
<section id="preview"><h2>Simulação <button data-close="preview">×</button></h2><div class="content"><label>Modo <select id="mode"><option value="ship">Navio na superfície</option><option value="sub">Submarino submerso</option><option value="sea">Somente oceano</option></select></label><label>Velocidade <input id="speed" type="range" min="0" max="16" step=".5" value="6"><output id="speedValue">6</output></label><label>Profundidade <input id="depth" type="range" min="2" max="70" value="25"><output id="depthValue">25</output></label><label>Simular movimento <input id="moving" type="checkbox" checked></label><label>Pausar ondas <input id="pause" type="checkbox"></label><button id="cameraReset">Recentrar câmera</button><p><small>Mouse: girar, zoom e pan. A câmera acompanha a unidade em movimento. Arraste os títulos para mover painéis.</small></p><p id="stats"></p></div></section>
<section id="jsonPanel"><h2>Asset JSON <button data-close="jsonPanel">×</button></h2><div class="content"><textarea id="json" spellcheck="false"></textarea><button id="applyJSON">Aplicar JSON</button><p><small>Edite e aplique; salvar grava no navegador.</small></p></div></section>
<footer>v0.4.3 · MIT — contribuições WMK · Walney Moreira Klein — walneyk@hotmail.com</footer>
<script type="module">
import * as THREE from "three";import {OrbitControls} from "three/addons/controls/OrbitControls.js";import {createOcean} from "../js/ocean.js";import {FIELDS,normalizeOcean,loadOcean,saveOcean,oceanPreset} from "../js/ocean-config.js";
const $=id=>document.getElementById(id);let config=loadOcean();const scene=new THREE.Scene();scene.background=new THREE.Color(0x567b8c);scene.fog=new THREE.Fog(0x567b8c,105,290);const camera=new THREE.PerspectiveCamera(55,1,.1,900);camera.position.set(22,12,28);const renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;$("viewport").append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxDistance=130;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0xcceeff,0x183849,2));const sun=new THREE.DirectionalLight(0xffe1b6,2);sun.position.set(-35,55,24);scene.add(sun);const ocean=createOcean(THREE,scene,config);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x284e4b}));floor.rotation.x=-Math.PI/2;floor.position.y=-17;scene.add(floor);
const hullMat=new THREE.MeshStandardMaterial({color:0x405967,roughness:.45,metalness:.5});const deckMat=new THREE.MeshStandardMaterial({color:0x6b8187,roughness:.65});const vehicle=new THREE.Group();scene.add(vehicle);function box(w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);vehicle.add(o);}
function build(){for(const o of [...vehicle.children]){o.geometry.dispose();vehicle.remove(o);}const sub=$("mode").value==="sub";const hull=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),hullMat);hull.scale.set(sub?.7:1.35,sub?.7:.9,sub?4.6:6);vehicle.add(hull);if(sub){box(.8,.8,1.4,0,.7,0,deckMat);box(.12,.7,.12,0,1.3,0,deckMat);}else{box(2.1,.4,8,0,.55,0,deckMat);box(1.6,1.2,2.2,0,1.25,-1,deckMat);box(.18,1.4,.18,0,2.5,-1,hullMat);}vehicle.position.set(0,0,0);controls.target.set(0,0,0);camera.position.set(22,12,28);ocean.clearEffects();}
const labels={amplitude:"Altura global",rate:"Velocidade das ondas",detail:"Ondulação fina",foam:"Espuma nas cristas",reflection:"Reflexo do céu",sun:"Brilho solar",opacity:"Opacidade superficial",underOpacity:"Opacidade submersa",wake:"Intensidade da esteira",wakeLife:"Duração da esteira (s)",wakeSpread:"Expansão da esteira",bubbles:"Taxa de bolhas",segments:"Segmentos da malha"};
function sync(){ocean.setConfig(config);$("json").value=JSON.stringify(config,null,2);}
function field(parent,name,val,min,max,step,change){const row=document.createElement("label"),text=document.createElement("span"),input=document.createElement("input"),out=document.createElement("output");text.textContent=name;input.type="range";Object.assign(input,{min,max,step,value:val});out.value=val;input.oninput=()=>{out.value=input.value;change(+input.value);$("preset").value="custom";sync();};row.append(text,input,out);parent.append(row);}
function draw(){ $("fields").replaceChildren();$("waves").replaceChildren();for(const [k,[min,max,step]] of Object.entries(FIELDS))field($("fields"),labels[k],config[k],min,max,step,v=>config[k]=v);
for(const [k,n] of Object.entries({deep:"Água profunda",shallow:"Água clara",foamColor:"Cor da espuma"})){let row=document.createElement("label");row.textContent=n;let i=document.createElement("input");i.type="color";i.value=config[k];i.oninput=()=>{config[k]=i.value;$("preset").value="custom";sync();};row.append(i);$("fields").append(row);}
config.waves.forEach((w,i)=>{const d=document.createElement("details"),sum=document.createElement("summary");sum.textContent="Camada de onda "+(i+1);d.append(sum);for(const [k,n,min,max,step] of [["amplitude","Amplitude",0,1.5,.005],["kx","Vetor X",-.7,.7,.005],["kz","Vetor Z",-.7,.7,.005],["speed","Velocidade angular",-3,3,.05]])field(d,n,w[k],min,max,step,v=>config.waves[i][k]=v);$("waves").append(d);});sync();}
function msg(t){$("status").textContent=t;}function apply(raw){config=normalizeOcean(raw);draw();$("preset").value="custom";}
$("preset").onchange=e=>{if(e.target.value!=="custom"){config=oceanPreset(e.target.value);draw();}};$("reset").onclick=()=>apply({});$("save").onclick=()=>{try{saveOcean(config);msg("Salvo. O jogo aberto na mesma origem recebe as alterações.");}catch(e){msg(e.message);}};
$("export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="wmk-ocean.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$("import").onclick=()=>$("file").click();$("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>65536)throw Error("Arquivo muito grande");apply(JSON.parse(await f.text()));msg("JSON importado.");}catch(e){msg(e.message);}finally{e.target.value="";}};$("applyJSON").onclick=()=>{try{apply(JSON.parse($("json").value));msg("JSON aplicado.");}catch(e){msg(e.message);}};
$("mode").onchange=build;$("cameraReset").onclick=build;for(const k of ["speed","depth"])$(k).oninput=()=>$(k+"Value").value=$(k).value;
const layoutKey="wmk_ocean_layout_v1";function saveLayout(){try{localStorage.setItem(layoutKey,JSON.stringify([...document.querySelectorAll("section")].map(p=>({id:p.id,left:p.offsetLeft,top:p.offsetTop,width:p.offsetWidth,height:p.offsetHeight,show:p.style.display!=="none"&&getComputedStyle(p).display!=="none"}))));}catch{}}
for(const p of document.querySelectorAll("section")){const h=p.querySelector("h2");h.onpointerdown=e=>{if(e.target.closest("button"))return;h.setPointerCapture(e.pointerId);let x=e.clientX-p.offsetLeft,y=e.clientY-p.offsetTop;h.onpointermove=e=>{p.style.right="auto";p.style.bottom="auto";p.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-x))+"px";p.style.top=Math.max(54,Math.min(innerHeight-45,e.clientY-y))+"px";};h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null;saveLayout();};};p.addEventListener("pointerup",saveLayout);}
try{for(const l of JSON.parse(localStorage.getItem(layoutKey)||"[]")){const p=$(l.id);if(!p)continue;if(l.show){Object.assign(p.style,{left:Math.max(0,Math.min(innerWidth-80,l.left))+"px",top:Math.max(54,Math.min(innerHeight-45,l.top))+"px",right:"auto",bottom:"auto",width:Math.max(180,l.width)+"px",height:Math.max(80,l.height)+"px"});}p.style.display=l.show?"block":"none";}}catch{}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{$(b.dataset.close).style.display="none";saveLayout();});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{$(b.dataset.open).style.display="block";saveLayout();});$("layoutReset").onclick=()=>{localStorage.removeItem(layoutKey);location.reload();};
function resize(){const w=$("viewport").clientWidth,h=$("viewport").clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}addEventListener("resize",resize);resize();draw();build();let last=performance.now(),time=0,frame=0;
renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;const paused=$("pause").checked;if(!paused)time+=dt;ocean.update(time);const sub=$("mode").value==="sub",speed=$("moving").checked&&!paused?+$("speed").value:0,depth=sub?+$("depth").value:0;vehicle.visible=$("mode").value!=="sea";
const prev=vehicle.position.clone();vehicle.position.z-=speed*dt;if(vehicle.position.z< -115){vehicle.position.z=0;ocean.clearEffects();controls.target.set(0,0,0);camera.position.set(22,12,28);}else{const delta=vehicle.position.clone().sub(prev);camera.position.add(delta);controls.target.add(delta);}
const x=vehicle.position.x,z=vehicle.position.z;vehicle.position.y=sub?.28-depth*.15:ocean.heightAt(x,z)*.85;vehicle.rotation.x=sub?0:Math.atan2(ocean.heightAt(x,z+4)-ocean.heightAt(x,z-4),8);if(vehicle.visible&&!paused)ocean.track("preview",x,z,0,speed,sub?1.4:2.6,sub?9.2:12,depth,dt);
controls.target.y=vehicle.visible?vehicle.position.y:0;controls.update();const underwater=camera.position.y<0;scene.background.setHex(underwater?0x082c40:0x567b8c);scene.fog.color.copy(scene.background);scene.fog.near=underwater?8:105;scene.fog.far=underwater?90:290;ocean.setUnderwater(underwater);ocean.setFog(scene.fog);ocean.renderEffects();renderer.render(scene,camera);if(++frame%30===0)$("stats").textContent="FPS aproximado: "+Math.round(1/Math.max(.001,dt))+" · Triângulos: "+renderer.info.render.triangles.toLocaleString("pt-BR");});
</script></body></html>
